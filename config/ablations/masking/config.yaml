auto_conf: False

data:
  train_path: "test_datasets/trial/cleanup"
  # train_path: "datasets/xml_29dof/rl_test"
  task_list_path: "test_datasets/chosen_tasks_test.yml"
  normalization_type: "min_max"
  dataset_class: "flexible"
  batch_size: 1024
  num_features: 50
  num_task_params: 3
  num_observations: 45
  start_timestep: 0
  num_timesteps: 10
  state_history: 1
  stride: 1
  normalize_goal_vec: True
  max_obj_displacement: 1.0

  feature_order:
    - delta_xy
    - delta_yaw
    - obj_delta_xy
    - joints
    - body_z
    - body_rot6d
    - obj_rel_pos
    - obj_rel_rot6d
    # ee_rel_pos

  key_mapping:
    body_pos_w: "root_pos"
    body_quat_w: "root_rot"
    joint_pos: "dof_pos"
    object_pos_w: "object_pos"
    object_quat_w: "object_rot"

model:
  type: "dfot"
  inpaint: True
  backbone_type: "dit1d"
  state_condition: True
  task_condition: True
  external_cond_dropout: 0.05
  hidden_size: 256
  depth: 8
  num_heads: 4
  mlp_ratio: 4.0
  pos_emb_type: "sinusoidal_1d"

training:
  save_dir: "./runs/ablations/masking/"
  log_dir: "./logs/ablations/masking/"
  suffix: ""
  num_epochs: 500
  balance_task_density: False
  learning_rate: 0.0005
  save_every: 50
  condition_dropout_prob: 
    state: 0.1
    task: 0.2
  add_obs_noise: True
  add_goal_noise: True
  state_conditioning_noise_level:
    joints: 0.025
    body_rot6d: 0.005
    obj_rel_pos: 0.005
    obj_rel_rot6d: 0.005
    task_params: 0.025
    task_magnitude: 0.0

  # In-betweening (waypoint-masked trajectory completion)
  inbetweening:
    enabled: False
    min_keyframes: 1        # minimum number of unmasked keyframes per window
    max_keyframes: 2        # maximum number of unmasked keyframes per window
    always_keep_first: True # always keep t=0 as a full keyframe
    always_keep_last: False # always keep t=T-1 as a keyframe
    waypoint_noise_fraction: 0.75  # max noise level for partial waypoint frames (fraction of total timesteps)
    arrival_ratio: 0.85            # object reaches target in this fraction of remaining time
    partial_masking:
      enabled: False
      prob: 1.0             # probability a waypoint is partial (vs full)
      feature_groups:       # named groups of features for partial masking
        locomotion: [delta_xy, delta_yaw, object_delta_xy]
        object_pos: [obj_delta_xy, obj_rel_pos]
        pose: [joints, body_z, body_rot6d]
        object_rot: [obj_rel_rot6d]
      group_keep_prob:      # per-group probability of being kept clean in a partial waypoint
        locomotion: 0.5
        object_pos: 0.15
        pose: 0.0
        object_rot: 0.0

noise_scheduler:
  deterministic_inference: False
  train_timesteps: 200
  inference_timesteps: 10
  prediction_type: "v_prediction"
  beta_schedule: "sigmoid" 
  noise_level: "random_uniform"
  scheduling_matrix: "full_sequence"