# paths.yaml — machine-local paths, not committed to version control.
# Copy this file and adjust for your environment.

paths:
  # Root directory for all datasets
  data_dir: "./test_datasets/"

  # Sub-path within data_dir that selects the active dataset split
  # train_path: "SBTO_OmniRetarget_diffusion"
  train_path: "trial/cleanup"

  # YAML file listing which tasks/subdirectories to load (relative to data_dir)
  # Set to null or remove to fall back to globbing all .npz files.
  task_list_path: "./test_datasets/chosen_tasks_test.yml"

  # Directory where checkpoints and norm stats are saved
  save_dir: "./results/runs/ablations/mar_14/"

  # Directory where tensorboard / WandB logs are written
  log_dir: "./results/logs/ablations/mar_14/"

  # MuJoCo XML model files (used for visualisation and FK evaluation)
  mj_model_xml: "./unitree_g1/mj_model.xml"
  mj_model_repeated_xml: "./unitree_g1/mj_model_repeated.xml"
