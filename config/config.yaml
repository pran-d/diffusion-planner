auto_conf: False

data:
  normalization_type: "min_max"
  dataset_class: "flexible"
  batch_size: 1024
  num_features: 48
  num_task_params: 4
  num_observations: 45
  start_timestep: 0
  num_timesteps: 50
  state_history: 5
  stride: 2
  normalize_goal_vec: True
  max_obj_displacement: 1.0
  downsample: 1
  rot_type: quat
  raw_dt: 0.03
  feature_order:
    - delta_xy
    - delta_yaw
    # - obj_delta_xy
    # - obj_z
    - joints
    - body_z
    - body_rot6d
    - obj_rel_pos
    - obj_rel_rot6d

  key_mapping:
    body_pos_w: "root_pos"
    body_quat_w: "root_rot"
    joint_pos: "dof_pos"
    object_pos_w: "object_pos"
    object_quat_w: "object_rot"
  
  augmentation:
    mirror_symmetry:
      enabled: True
      prob: 0.5
  
  num_styles: 3
  style_conditioning:
    enabled: False
    detection_mode: motion_then_text
    num_styles: 3
    seed: 42
    tasks_file: ./test_datasets/tasks.yml

model:
  type: "dfot"
  inpaint: True
  backbone_type: "dit1d_dual"
  state_condition: True
  style_condition: False
  task_condition: True
  external_cond_dropout: 0.05
  hidden_size: 256
  # dit1d-only depth (kept for backward compat when backbone_type: dit1d)
  depth: 8
  # # dit1d_dual branch depths
  branch1_depth: 8    # World branch (delta_xy, obj pose, …)
  branch2_depth: 6    # Body branch  (joints, body_z, body_rot6d)
  # Feature groups for each branch (must cover all 51 dims, no overlap)
  branch1_features:
    - delta_xy
    - delta_yaw
    # - obj_delta_xy
    # - obj_z
    - body_z
    - obj_rel_pos
    - obj_rel_rot6d
  branch2_features:
    - joints
    - body_rot6d
  num_heads: 4
  mlp_ratio: 4.0
  pos_emb_type: "learned_1d"
  group_wise_embedding: True # only used for dit1d 
  history_aggregation: "attn"

training:
  suffix: _omniretarget_rollout_dual
  num_epochs: 200
  balance_task_density: False
  learning_rate: 0.0005
  save_every: 10
  condition_dropout_prob: 
    state: 0.1
    style: 0.05
    task: 0.2
  add_obs_noise: True
  add_goal_noise: True
  smoothness_loss_weight: 0.1
  grasp_consistency_loss_weight: 0.25
  feet_sliding_loss_weight: 0.0
  grasp_distance_threshold: 0.35
  stance_velocity_threshold: 0.02
  state_conditioning_noise_level:
    joints: 0.025
    body_rot6d: 0.005
    obj_rel_pos: 0.005
    obj_rel_rot6d: 0.005
    task_params: 0.025
    task_magnitude: 0.0
  density_sigma: 0.2
  ema_decay: 0.9995
  ema_update_after_step: 0
  batches_per_epoch: null

  # In-betweening (waypoint-masked trajectory completion)
  inbetweening:
    enabled: True
    resample_steps: 2
    min_keyframes: 0
    max_keyframes: 3
    always_keep_first: True
    keep_last_partial: True
    waypoint_noise_fraction: 0.5
    arrival_ratio: 0.85
    force_all_known_prob: 0.0
    force_near_empty_prob: 0.0

    partial_masking:
      enabled: True
      prob: 1.0
      joints_split: 12
      feature_groups:
        locomotion: [obj_delta_xy]
        pick_place: [obj_z]
        object_pos: [obj_rel_pos, obj_rel_rot6d]
        lower_body: [joints_lower]   # hip / knee / ankle joints (indices 0-11)
        upper_body: [joints_upper]   # waist + shoulder / elbow / wrist joints (indices 12-28)
        pose: [body_rot6d]
        robot_pos: [body_z, delta_xy, delta_yaw]
      group_keep_prob:
        locomotion: 0.2
        pick_place: 0.2
        lower_body: 0.2
        upper_body: 0.2
        object_pos: 0.1
        pose: 0.1
        robot_pos: 0.1
      per_group_noise_fractions:
        default: 1.0
        obj_delta_xy: 0.5
        obj_z: 0.5

noise_scheduler:
  deterministic_inference: True
  train_timesteps: 200
  inference_timesteps: 10
  prediction_type: "v_prediction"
  beta_schedule: "sigmoid" 
  noise_level: "random_uniform"
  scheduling_matrix: "full_sequence"
  use_fourier_noise_embedding: False
  noise_level_conditioning_reduce: "max"