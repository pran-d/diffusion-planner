auto_conf: False
resume: False
resume_checkpoint: 1000

model:
  type: "dfot"
  backbone_type: "dit1d"
  state_condition: True
  task_condition: True
  external_cond_dropout: 0.05
  hidden_size: 128
  depth: 12
  num_heads: 8
  mlp_ratio: 4.0
  pos_emb_type: "sinusoidal_1d"
  goal_in_curr_state: False

noise_scheduler:
  deterministic_inference: True
  train_timesteps: 400
  inference_timesteps: 20
  prediction_type: "v_prediction"
  beta_schedule: "squaredcos_cap_v2" 
  return_steps: False
  noise_level: "random_independent"
  scheduling_matrix: "full_sequence"
  use_causal_mask: False
  variable_context: True

data:
  dir_path: "/home/pranish/pranav/diffusion-mp/simple_diffusion/"
  train_path: "test_datasets/pick_place_high_elites"
  # train_path: "datasets/xml_29dof/rl_test"
  # task_list_path: "test_datasets/chosen_tasks_test.yml"
  dataset_class: "flexible"
  batch_size: 80
  num_features: 48
  num_task_params: 2
  num_observations: 45
  start_timestep: 0
  num_timesteps: 487
  state_history: 1
  downsample: 1

training:
  save_dir: "./runs/"
  log_dir: "./logs/"
  suffix: "_generator"
  num_epochs: 10000
  batches_per_epoch: 256
  learning_rate: 0.0005
  save_every: 250
  condition_dropout_prob: 
    state: 0.1
    task: 0.2
  add_obs_noise: True
  add_goal_noise: True
  state_conditioning_noise_level:
    joints: 0.005
    body_z: 0.005
    body_rot6d: 0.005
    obj_rel_pos: 0.005
    obj_rel_rot6d: 0.005
    # joint_vel: 0.2
    # body_lin_vel: 0.1
    # body_ang_vel: 0.1
    # obj_lin_vel: 0.1
    # obj_ang_vel: 0.1
    task_params: 0.0
