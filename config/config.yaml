auto_conf: false
two_phase:
  enabled: false
  phase1_features:
  - delta_xy
  - delta_yaw
  - body_z
  - obj_rel_pos
  - obj_rel_rot6d
  phase2_features:
  - joints
  - body_rot6d
  phase1_checkpoint: null
  phase2_checkpoint: null
data:
  normalization_type: min_max
  dataset_class: flexible
  batch_size: 3072
  num_features: 48
  num_styles: 3
  num_task_params: 4
  num_observations: 45
  start_timestep: 0
  num_timesteps: 40
  state_history: 2
  stride: 2
  normalize_goal_vec: true
  max_obj_displacement: 1.0
  downsample: 1
  rot_type: quat
  raw_dt: 0.01
  feature_order:
  - delta_xy
  - delta_yaw
  - joints
  - body_z
  - body_rot6d
  - obj_rel_pos
  - obj_rel_rot6d
  key_mapping:
    body_pos_w: root_pos
    body_quat_w: root_rot
    joint_pos: dof_pos
    object_pos_w: object_pos
    object_quat_w: object_rot
  augmentation:
    mirror_symmetry:
      enabled: true
      prob: 0.5
  task_list_path: null
  style_conditioning:
    enabled: true
    detection_mode: motion_then_text
    num_styles: 3
    seed: 42
    tasks_file: ./test_datasets/tasks.yml
model:
  type: dfot
  inpaint: true
  backbone_type: dit1d
  state_condition: true
  style_condition: true
  task_condition: true
  external_cond_dropout: 0.05
  hidden_size: 256
  depth: 8
  num_heads: 4
  mlp_ratio: 4.0
  pos_emb_type: learned_1d
  group_wise_embedding: true
  history_aggregation: attn
training:
  suffix: _style_condition
  num_epochs: 20
  balance_task_density: false
  learning_rate: 0.0005
  save_every: 2
  condition_dropout_prob:
    state: 0.1
    style: 0.05
    task: 0.2
  add_obs_noise: true
  add_goal_noise: true
  smoothness_loss_weight: 0.1
  grasp_consistency_loss_weight: 0.25
  feet_sliding_loss_weight: 0.0
  grasp_distance_threshold: 0.35
  stance_velocity_threshold: 0.02
  state_conditioning_noise_level:
    joints: 0.025
    body_rot6d: 0.005
    obj_rel_pos: 0.005
    obj_rel_rot6d: 0.005
    task_params: 0.025
    task_magnitude: 0.0
  density_sigma: 0.2
  ema_decay: 0.9995
  ema_update_after_step: 0
  batches_per_epoch: null
  state_conditioning_masking:
    enabled: false
    prob: 0.25
    locomotion_dropout_prob: 0.3
    masked_obj_loss_scale: 0.0
    feature_groups:
      robot_pose:
      - body_z
      - body_rot6d
      robot_joints:
      - joints
      object_pose:
      - obj_rel_pos
      - obj_rel_rot6d
    group_drop_prob:
      robot_pose: 0.25
      robot_joints: 0.25
      object_pose: 0.25
  stitched_rollouts:
    enabled: false
    num_windows: 2
    overlap: 1
    start_epoch: 50
    end_epoch: 300
    max_prob: 0.5
    detach: true
  inbetweening:
    enabled: true
    resample_steps: 3
    min_keyframes: 0
    max_keyframes: 3
    always_keep_first: true
    keep_last_partial: true
    waypoint_noise_fraction: 0.5
    arrival_ratio: 0.85
    force_all_known_prob: 0.1
    force_near_empty_prob: 0.1
    waypoint_schemas:
      full:
        prob: 0.15
        pinned:
          first:
          - all
          intermediate:
          - all
          last:
          - all
      box_only:
        prob: 0.45
        pinned:
          first:
          - all
          intermediate:
          - delta_xy
          - delta_yaw
          last:
          - obj_delta_xy
          - obj_z
      locomotion_only:
        prob: 0.4
        pinned:
          first: []
          intermediate: []
          last: []
        ignore_features:
        - obj_delta_xy
        - obj_z
        - obj_rel_pos
        - obj_rel_rot6d
    partial_masking:
      enabled: true
      prob: 1.0
      joints_split: 12
      feature_groups:
        locomotion:
        - obj_delta_xy
        pick_place:
        - obj_z
        object_pos:
        - obj_rel_pos
        - obj_rel_rot6d
        lower_body:
        - joints_lower
        upper_body:
        - joints_upper
        pose:
        - body_rot6d
        robot_pos:
        - body_z
        - delta_xy
        - delta_yaw
      group_keep_prob:
        locomotion: 0.5
        pick_place: 0.2
        lower_body: 0.15
        upper_body: 0.15
        object_pos: 0.0
        pose: 0.0
        robot_pos: 0.0
      per_group_noise_fractions:
        default: 1.0
        obj_delta_xy: 0.5
        obj_z: 0.5
noise_scheduler:
  deterministic_inference: true
  train_timesteps: 200
  inference_timesteps: 10
  prediction_type: v_prediction
  beta_schedule: sigmoid
  noise_level: random_uniform
  scheduling_matrix: full_sequence
  use_fourier_noise_embedding: false
  noise_level_conditioning_reduce: max
  hierarchical_noise:
    enabled: false
    phase1_feature_keys:
    - delta_xy
    - delta_yaw
    - body_z
    - obj_rel_pos
    - obj_rel_rot6d
    phase2_feature_keys:
    - joints
    - body_rot6d
    phase1_max_ratio: 0.5
    phase2_min_ratio: 0.0
  hierarchical_schedule:
    enabled: false
    phase1_end_ratio: 0.5
