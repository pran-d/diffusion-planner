auto_conf: False
resume: False
resume_checkpoint: 200

data:
  dir_path: "/home/pranish/pranav/diffusion-mp/simple_diffusion/"
  train_path: "test_datasets/trial"
  # train_path: "datasets/xml_29dof/rl_test"
  # task_list_path: "test_datasets/chosen_tasks_test.yml"
  normalization_type: "min_max"
  dataset_class: "flexible"
  batch_size: 1024
  num_features: 50
  num_task_params: 3
  num_observations: 45
  start_timestep: 15
  num_timesteps: 10
  state_history: 1
  stride: 2
  normalize_goal_vec: True

  # key_mapping:
  #   body_pos_w: "root_pos"
  #   body_quat_w: "root_rot"
  #   joint_pos: "dof_pos"
  #   object_pos_w: "object_pos"
  #   object_quat_w: "object_rot"

model:
  type: "dfot"
  backbone_type: "dit1d"
  inpaint: True
  state_condition: True
  task_condition: True
  external_cond_dropout: 0.05
  hidden_size: 128
  depth: 12
  num_heads: 8
  mlp_ratio: 4.0
  pos_emb_type: "sinusoidal_1d"

training:
  save_dir: "./runs/ablations/exp1/"
  log_dir: "./logs/ablations/exp1/"
  suffix: "_all_motions"
  num_epochs: 5000
  balance_task_density: False
  learning_rate: 0.0005
  save_every: 5
  condition_dropout_prob: 
    state: 0.1
    task: 0.2
  add_obs_noise: True
  add_goal_noise: True
  state_conditioning_noise_level:
    joints: 0.01
    body_rot6d: 0.005
    obj_rel_pos: 0.005
    obj_rel_rot6d: 0.005
    # joint_vel: 0.2
    # body_lin_vel: 0.1
    # body_ang_vel: 0.1
    # obj_lin_vel: 0.1
    # obj_ang_vel: 0.1
    task_params: 0.05

noise_scheduler:
  deterministic_inference: False
  train_timesteps: 200
  inference_timesteps: 10
  prediction_type: "v_prediction"
  beta_schedule: "sigmoid" 
  noise_level: "random_uniform"
  scheduling_matrix: "full_sequence"