auto_conf: False

data:
  normalization_type: "min_max"
  dataset_class: "flexible"
  batch_size: 1024
  num_features: 51
  num_task_params: 3
  num_observations: 45
  start_timestep: 0
  num_timesteps: 10
  state_history: 2
  stride: 2
  normalize_goal_vec: True
  max_obj_displacement: 1.0

  feature_order:
    - delta_xy
    - delta_yaw
    - obj_delta_xy
    - obj_z
    - joints
    - body_z
    - body_rot6d
    - obj_rel_pos
    - obj_rel_rot6d
    # ee_rel_pos

  key_mapping:
    body_pos_w: "root_pos"
    body_quat_w: "root_rot"
    joint_pos: "dof_pos"
    object_pos_w: "object_pos"
    object_quat_w: "object_rot"

  # ── Data augmentation ──
  augmentation:
    mirror_symmetry:
      enabled: False           # G1 left/right (C2 sagittal-plane) reflection
      prob: 0.5                # probability of mirroring each sample

model:
  type: "dfot"
  inpaint: True
  backbone_type: "dit1d"
  state_condition: True
  task_condition: True
  external_cond_dropout: 0.05
  hidden_size: 256
  depth: 8
  num_heads: 4
  mlp_ratio: 4.0
  pos_emb_type: "learned_1d"
  group_wise_embedding: True  # per-semantic-group input projections (sum into hidden)

training:
  save_dir: "./runs/ablations/physics_loss/"
  log_dir: "./logs/ablations/physics_loss/"
  suffix: ""
  num_epochs: 750
  balance_task_density: False
  learning_rate: 0.0005
  save_every: 50
  condition_dropout_prob: 
    state: 0.1
    task: 0.2
  add_obs_noise: True
  add_goal_noise: True

  # ── State conditioning masking (random feature-group dropout on obs) ──
  state_conditioning_masking:
    enabled: False
    prob: 0.3                  # probability of applying masking to a sample
    feature_groups:            # which observation groups can be dropped
      object_state: [obj_rel_pos, obj_rel_rot6d]
      body_orientation: [body_rot6d]
      lower_joints: [joints_left_leg, joints_right_leg]
      upper_joints: [joints_left_arm, joints_right_arm, joints_torso]
    group_drop_prob:           # per-group probability of being zeroed out
      object_state: 0.4
      body_orientation: 0.2
      lower_joints: 0.2
      upper_joints: 0.2

  # ── Stitched rollout training (autoregressive multi-window) ──
  stitched_rollouts:
    enabled: False
    num_windows: 2             # number of sub-windows to chain
    overlap: 1                 # overlapping frames between consecutive sub-windows
    start_epoch: 50            # epoch at which stitching probability begins ramping
    end_epoch: 300             # epoch at which stitching probability reaches max
    max_prob: 0.5              # maximum probability of using stitched forward
    detach: True               # detach predicted state between windows (cap gradient length)

  # Auxiliary loss weights (set > 0 to enable)
  smoothness_loss_weight: 0.0 #0.1      # penalise frame-to-frame jitter in predicted trajectory
  grasp_consistency_loss_weight: 0.0 #0.75 # penalise obj_rel_pos drift during grasping phases
  feet_sliding_loss_weight: 0.0 #0.2      # proxy: penalise ankle velocity during GT stance phases
    # smoothness_feature_groups: [joints, body_rot6d]  # optional: restrict to specific groups
  grasp_distance_threshold: 0.35     # obj-body distance below which grasp gate activates
  stance_velocity_threshold: 0.02    # ankle vel magnitude below which GT is considered stance

  state_conditioning_noise_level:
    joints: 0.025
    body_rot6d: 0.005
    obj_rel_pos: 0.005
    obj_rel_rot6d: 0.005
    task_params: 0.025
    task_magnitude: 0.0

  # In-betweening (waypoint-masked trajectory completion)
  inbetweening:
    enabled: True
    resample_steps: 3      # number of times to re-mask and re-predict waypoints during training
    min_keyframes: 0        # minimum number of unmasked keyframes per window
    max_keyframes: 3        # maximum number of unmasked keyframes per window
    always_keep_first: True # always keep t=0 as a full keyframe
    keep_last_partial: True # always keep t=T-1 as a keyframe
    waypoint_noise_fraction: 0.5  # max noise level for partial waypoint frames (fraction of total timesteps)
    arrival_ratio: 0.85            # object reaches target in this fraction of remaining time

    # ── Forced extreme conditioning regimes ──
    force_all_known_prob: 0.0    # prob of making ALL frames full keyframes (reconstruction mode)
    force_near_empty_prob: 0.0   # prob of keeping only 1 random group at 1 random frame

    partial_masking:
      enabled: True
      prob: 1.0             # probability a waypoint is partial (vs full)
      joints_parts: 5       # 5-part anatomical split (left_leg, right_leg, torso, left_arm, right_arm)
      # joints_split: 12    # legacy 2-part split (lower/upper) — ignored when joints_parts=5
      feature_groups:       # named groups of features for partial masking
        locomotion: [obj_delta_xy]
        pick_place: [obj_z]
        object_pos: [obj_rel_pos, obj_rel_rot6d]
        left_leg:  [joints_left_leg]    # hip / knee / ankle joints (indices 0-5)
        right_leg: [joints_right_leg]   # hip / knee / ankle joints (indices 6-11)
        torso:     [joints_torso]       # waist yaw / roll / pitch  (indices 12-14)
        left_arm:  [joints_left_arm]    # shoulder through wrist    (indices 15-21)
        right_arm: [joints_right_arm]   # shoulder through wrist    (indices 22-28)
        pose: [body_rot6d]
        robot_pos: [body_z, delta_xy, delta_yaw]
      group_keep_prob:      # per-group probability of being kept clean in a partial waypoint
        locomotion: 0.5
        pick_place: 0.2
        left_leg: 0.15
        right_leg: 0.15
        torso: 0.15
        left_arm: 0.15
        right_arm: 0.15
        object_pos: 0.0
        pose: 0.0
        robot_pos: 0.0

noise_scheduler:
  deterministic_inference: True
  train_timesteps: 200
  inference_timesteps: 10
  prediction_type: "v_prediction"
  beta_schedule: "sigmoid" 
  noise_level: "random_uniform"
  scheduling_matrix: "full_sequence"
  # Blended denoising (PARC-style state-axis CFG, inference only)
  # blend_w: 0.0  # set via CLI --blend_w (0=off, 0.35=moderate, 0.65=PARC default)