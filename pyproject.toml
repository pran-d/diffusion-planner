[project]
name = "diffusion-planner"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "torch==2.9.0",
    "torchvision==0.24.0",
    "numpy==2.2.6",
    "matplotlib==3.10.7",
    "pyyaml==6.0.3",
    "mujoco==3.4.0",
    "mujoco-mjx==3.4.0",
    "diffusers==0.36.0",
    "scipy==1.15.3",
    "einops==0.8.1",
    "tqdm==4.67.1",
    "omegaconf==2.3.0",
    "accelerate==1.11.0",
    "transformers==4.57.1",
    "tokenizers==0.22.1",
    "safetensors==0.6.2",
    "huggingface-hub==0.36.0",
    "datasets==2.16.1",
    "timm==1.0.22",
    "wandb==0.25.0",
    "tyro==1.0.6",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "opencv-python==4.12.0.88",
    "pillow==12.0.0",
    "trimesh==4.10.1",
    "glfw==2.10.0",
    "pyopengl==3.1.10",
    "rotary-embedding-torch==0.8.9",
    "torchdiffeq==0.2.5",
    "tensorboard==2.20.0",
    "jax==0.6.2",
    "jaxlib==0.6.2",
    "warp-lang==1.10.1",
    "ipywidgets==8.1.7",
    "bitsandbytes==0.48.1",
    "psutil==7.1.2",
    "ftfy==6.3.1",
    "regex==2025.10.23",
    "sympy==1.14.0",
    "networkx==3.4.2",
    "setuptools>=82.0.1",
]

[tool.uv]
# Use unsafe-best-match so uv can find packages across multiple indexes
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
triton = { index = "pytorch" }
