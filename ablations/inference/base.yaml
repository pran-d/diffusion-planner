# Shared defaults for inference ablations.
# Each ablation YAML should only override changed fields.

name: base
seed: 42
num_test_samples: 20

# fixed eval sample selector
sample_selector:
  traj_idx: 0
  batch_idx: 0
  max_start_time: null

# checkpoint settings
checkpoint:
  epoch: latest
  ema: true

# runtime
runtime:
  device: cuda
  batch_size: 20

# planning/inference controls
inference:
  inference_timesteps: 10
  cfg_w: 1.0
  # Optional overrides forwarded into noise_scheduler at runtime.
  scheduling_matrix: full_sequence
  hierarchical_noise:
    enabled: false
  hierarchical_schedule:
    enabled: false
    phase1_end_ratio: 0.5
  stitch_steps: null
  use_last_frame_wp: true
  arrival_ratio: 0.85
  lift_height: 0.5
  no_lower_dist: 0.4
  lift_start: 0.0
  lift_end: 0.20
  walk_start_z: 0.80
  enable_goal_stop: true
  end_error_threshold: 0.10
  enable_physics_stop: false
  enable_physics_clamp: true

# optional speedups
speedup_tricks:
  use_fp16: false
  torch_compile: false
  kv_cache: false
  consistency_decoding: false
